glossary_terms:
  - term: Dictionary
    definition: >
      A mutable, ordered collection of key-value pairs. Provides O(1) average lookup,
      insertion, and deletion via hashing. Keys must be hashable.
  - term: Key
    definition: >
      The identifier used to store and retrieve a value in a dictionary. Keys must be
      immutable (hashable) objects, such as strings, numbers, or tuples.
  - term: Value
    definition: >
      The data associated with a key in a dictionary. Values can be any Python object,
      including lists, other dicts, or functions.
  - term: Hash Map
    definition: >
      The underlying data structure of a Python dict. Keys are hashed to determine
      storage location, enabling average O(1) access time.
  - term: dict.get()
    definition: >
      A safe way to access a dictionary value that returns a default (None by default)
      instead of raising KeyError when the key is absent.
