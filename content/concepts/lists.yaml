glossary_terms:
  - term: Mutable
    definition: >
      An object whose content can be changed after it is created. Lists are mutable;
      strings and tuples are immutable.
  - term: Append
    definition: >
      The .append(x) method adds a single item x to the end of a list in O(1) amortized
      time. It modifies the list in place and returns None.
  - term: Slice
    definition: >
      A sub-list created by the lst[start:stop:step] syntax. Slicing a list always returns
      a new list (a shallow copy of the selected elements).
  - term: In-place
    definition: >
      An operation that modifies the original object directly rather than creating a new
      one. List methods like .sort(), .reverse(), and .append() are in-place.
  - term: Dynamic Array
    definition: >
      The underlying storage of a Python list. It automatically grows (typically doubles)
      when capacity is exceeded, giving amortized O(1) append performance.
