glossary_terms:
  - term: Scope
    definition: >
      The region of a program where a name (variable, function) is visible and accessible.
      Python has local, enclosing, global, and built-in scopes.
  - term: LEGB Rule
    definition: >
      Python's name resolution order: Local → Enclosing → Global → Built-in. Python
      searches each scope in this order until the name is found.
  - term: Global Scope
    definition: >
      The module-level namespace. Variables and functions defined at the top level of a
      file are in global scope and accessible throughout the module.
  - term: Closure
    definition: >
      An inner function that captures and remembers variables from its enclosing scope,
      even after the outer function has finished executing.
  - term: nonlocal
    definition: >
      A keyword that declares a variable in an inner function refers to the nearest
      enclosing function's scope (not global). Needed to reassign enclosing variables.
  - term: UnboundLocalError
    definition: >
      Raised when Python determines a name is local (because it's assigned somewhere in
      the function) but the code tries to read it before the assignment executes.
