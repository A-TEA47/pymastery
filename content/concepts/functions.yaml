glossary_terms:
  - term: Function
    definition: >
      A named, reusable block of code defined with `def`. Accepts input via parameters,
      performs work, and optionally returns a value with `return`.
  - term: Parameter
    definition: >
      A variable name in the function definition that acts as a placeholder for the
      value passed when the function is called.
  - term: Argument
    definition: >
      The actual value supplied to a function when it is called. Arguments are assigned
      to parameters.
  - term: Return Value
    definition: >
      The value produced by a function and sent back to the caller with the `return`
      statement. A function without return (or with bare return) returns None.
  - term: Docstring
    definition: >
      A string literal as the first statement of a function (or module/class) that
      documents its purpose, parameters, and return value. Accessible via __doc__.
  - term: "*args / **kwargs"
    definition: >
      *args collects extra positional arguments into a tuple; **kwargs collects extra
      keyword arguments into a dict. Both are used to write flexible, variadic functions.
