glossary_terms:
  - term: Tuple
    definition: >
      An immutable, ordered sequence of Python objects. Defined with parentheses or
      commas, and accessed like a list via indexing and slicing.
  - term: Packing
    definition: >
      Combining multiple values into a single tuple, e.g., coords = x, y, z.
  - term: Unpacking
    definition: >
      Assigning each element of a tuple (or any iterable) to a separate variable in
      one statement, e.g., x, y = point.
  - term: Hashable
    definition: >
      An object is hashable if it has a stable hash value over its lifetime. Tuples of
      hashable elements are hashable and can be used as dictionary keys or set members.
  - term: Named Tuple
    definition: >
      A subclass of tuple created by collections.namedtuple that gives each field a
      descriptive name, accessed via dot notation as well as indexing.
