glossary_terms:
  - term: Type Conversion
    definition: >
      Explicitly changing a value from one data type to another using functions like
      int(), float(), str(), or bool().
  - term: Floor Division
    definition: >
      The // operator divides two numbers and rounds the result down to the nearest
      integer, discarding the fractional part.
  - term: Modulo
    definition: >
      The % operator returns the remainder after integer division. For example,
      10 % 3 equals 1 because 10 = 3*3 + 1.
  - term: Truthy / Falsy
    definition: >
      In Python, values that evaluate to True in a boolean context are "truthy";
      those that evaluate to False are "falsy". Falsy values include 0, 0.0, "",
      None, [], {}, and set().
  - term: Short-Circuit Evaluation
    definition: >
      Python stops evaluating 'and'/'or' expressions as soon as the outcome is
      determined. In 'A and B', if A is falsy, B is never evaluated.
