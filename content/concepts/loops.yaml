glossary_terms:
  - term: Iteration
    definition: >
      The process of accessing each element in a collection one at a time, typically
      using a for loop. Any object with an __iter__ method is "iterable".
  - term: range()
    definition: >
      A built-in function that generates a lazy sequence of integers. Syntax:
      range(stop), range(start, stop), range(start, stop, step).
  - term: enumerate()
    definition: >
      A built-in that wraps an iterable and yields (index, value) tuples, optionally
      starting the index at a specified value (default 0).
  - term: zip()
    definition: >
      A built-in that pairs elements from multiple iterables together, yielding tuples.
      Stops when the shortest iterable is exhausted.
  - term: Accumulator Pattern
    definition: >
      A pattern where a variable (the accumulator) starts at an initial value (0, [],
      etc.) and is updated on each loop iteration to build up a result.
  - term: List Comprehension
    definition: >
      A concise syntax for building a list: [expression for item in iterable if condition].
      Often more readable and faster than an equivalent for loop with append.
