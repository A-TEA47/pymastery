glossary_terms:
  - term: Conditional Statement
    definition: >
      A programming construct (if / elif / else) that executes different code blocks
      based on whether a condition evaluates to True or False.
  - term: Truthiness
    definition: >
      Python's rule for treating any object as True or False in a boolean context.
      Falsy values include 0, 0.0, "", None, and empty containers.
  - term: Ternary Expression
    definition: >
      A compact single-line conditional: `x if condition else y`. It is an expression
      that evaluates to one of two values depending on the condition.
  - term: elif
    definition: >
      Short for "else if". Allows chaining multiple conditions after an initial if.
      Only the first truthy branch executes.
  - term: Short-Circuit Evaluation
    definition: >
      With 'and', evaluation stops at the first falsy operand; with 'or', it stops at
      the first truthy operand. The remaining operands are not evaluated.
