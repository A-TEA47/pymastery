glossary_terms:
  - term: Immutable
    definition: >
      An object whose value cannot be changed after creation. Strings are immutable in
      Python — any operation that appears to modify a string actually creates a new one.
  - term: Index
    definition: >
      An integer position used to access a single element in a sequence. Python uses
      zero-based indexing (first element is at index 0). Negative indices count from the end.
  - term: Slice
    definition: >
      A way to extract a sub-sequence using the syntax [start:stop:step]. The start is
      inclusive and the stop is exclusive.
  - term: f-string
    definition: >
      A formatted string literal (prefix f"...") that allows embedding Python expressions
      directly inside string braces {}. Introduced in Python 3.6.
  - term: String Method
    definition: >
      A function attached to a string object (called with dot notation) that performs an
      operation on the string and returns a result, since strings are immutable.
