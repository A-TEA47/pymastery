glossary_terms:
  - term: Set
    definition: >
      A mutable, unordered collection of unique hashable elements. Implemented as a
      hash table for O(1) average add, remove, and membership operations.
  - term: Union
    definition: >
      The set of all elements that appear in either of two sets. Written as A | B or
      A.union(B).
  - term: Intersection
    definition: >
      The set of elements common to both sets. Written as A & B or A.intersection(B).
  - term: Difference
    definition: >
      The set of elements in A that are not in B. Written as A - B or A.difference(B).
  - term: frozenset
    definition: >
      An immutable version of a set. Because it cannot change, it is hashable and can
      be used as a dictionary key or as an element inside another set.
