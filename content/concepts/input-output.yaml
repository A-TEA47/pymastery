glossary_terms:
  - term: input()
    definition: >
      A built-in function that displays an optional prompt and reads a line of text from
      the user (stdin). Always returns the result as a string.
  - term: print()
    definition: >
      A built-in function that writes objects to stdout. Supports sep (separator),
      end (line ending), and file (output stream) parameters.
  - term: stdin / stdout
    definition: >
      Standard input (stdin) is where programs read user input (usually the keyboard).
      Standard output (stdout) is where print() sends its output (usually the screen).
  - term: Pyodide
    definition: >
      A port of CPython to WebAssembly, allowing Python to run in a web browser. Some
      standard library features (like blocking input()) require workarounds in this context.
  - term: Type Conversion of Input
    definition: >
      The necessary step of calling int(), float(), or another type constructor on the
      string returned by input() before performing numeric operations.
