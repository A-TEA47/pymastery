id: longest-streak
concept_ids:
  - loops
level: intermediate
tier: challenge
difficulty: 6
title: Longest Consecutive Run of Ones
prompt: |
  Write a function longest_consecutive_ones(bits) that takes a list of
  integers containing only 0s and 1s, and returns the length of the longest
  consecutive run of 1s.

  Rules:
    - If the list is empty or contains no 1s, return 0.
    - A "run" is an unbroken sequence of consecutive 1s.

  Examples:
    longest_consecutive_ones([1, 1, 0, 1, 1, 1])  -> 3
    longest_consecutive_ones([0, 0, 0])            -> 0
    longest_consecutive_ones([1, 1, 1, 1, 1])      -> 5
    longest_consecutive_ones([1, 0, 1, 0, 1])      -> 1
    longest_consecutive_ones([])                   -> 0
starter_code: |
  def longest_consecutive_ones(bits):
      # your code here
      pass
solution_code: |
  def longest_consecutive_ones(bits):
      max_run = 0
      current_run = 0
      for bit in bits:
          if bit == 1:
              current_run += 1
              if current_run > max_run:
                  max_run = current_run
          else:
              current_run = 0
      return max_run
function_name: longest_consecutive_ones
test_cases:
  - input: [[1, 1, 0, 1, 1, 1]]
    expected: 3
  - input: [[0, 0, 0]]
    expected: 0
  - input: [[1, 1, 1, 1, 1]]
    expected: 5
  - input: [[1, 0, 1, 0, 1]]
    expected: 1
  - input: [[]]
    expected: 0
  - input: [[0, 1, 1, 0, 0, 1, 1, 1, 0]]
    expected: 3
hidden_test_cases:
  - input: [[1, 1, 1, 0, 1, 1, 1, 1]]
    expected: 4
  - input: [[0]]
    expected: 0
hints:
  - "Use two counters: current_run (resets to 0 on each 0) and max_run (updated whenever current_run grows)."
  - "Loop through each bit. When you see a 1, increment current_run and compare with max_run. When you see a 0, reset current_run to 0."
  - "Make sure to update max_run INSIDE the loop, not just at the end, in case the longest run ends before the list does."
external_reference:
  source: leetcode
  title: "Similar: Max Consecutive Ones"
  url: "https://leetcode.com/problems/max-consecutive-ones/"
time_limit_minutes: 20
tags:
  - loops
