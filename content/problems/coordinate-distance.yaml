id: coordinate-distance
concept_ids:
  - tuples
level: intermediate
tier: challenge
difficulty: 7
title: Closest Pair of Points
prompt: |
  Write a function closest_pair(points) that takes a list of (x, y) tuples
  representing 2D coordinates and returns the pair of points that are closest
  to each other, as a tuple of two tuples.

  Rules:
    - Compare every unique pair of points using Euclidean distance.
    - You do NOT need to take the square root — comparing squared distances
      is sufficient and avoids floating-point issues.
    - If multiple pairs share the same minimum distance, return the pair whose
      FIRST point appears earliest in the list. If those are also tied, use
      the pair whose SECOND point appears earliest.
    - You may assume the list has at least 2 points.
    - The returned tuple should be ((x1, y1), (x2, y2)) where (x1, y1)
      comes before (x2, y2) in the original list.

  Examples:
    closest_pair([(0,0),(3,4),(1,1)])      -> ((0,0),(1,1))
    closest_pair([(0,0),(1,0),(0,1),(5,5)]) -> ((0,0),(1,0))
    closest_pair([(1,2),(3,4)])            -> ((1,2),(3,4))
starter_code: |
  def closest_pair(points):
      # your code here
      pass
solution_code: |
  def closest_pair(points):
      best_dist = None
      best_pair = None
      n = len(points)
      for i in range(n):
          for j in range(i + 1, n):
              dx = points[i][0] - points[j][0]
              dy = points[i][1] - points[j][1]
              dist = dx * dx + dy * dy
              if best_dist is None or dist < best_dist:
                  best_dist = dist
                  best_pair = (points[i], points[j])
      return best_pair
function_name: closest_pair
test_cases:
  - input: [[[0, 0], [3, 4], [1, 1]]]
    expected: [[0, 0], [1, 1]]
  - input: [[[0, 0], [1, 0], [0, 1], [5, 5]]]
    expected: [[0, 0], [1, 0]]
  - input: [[[1, 2], [3, 4]]]
    expected: [[1, 2], [3, 4]]
  - input: [[[0, 0], [10, 10], [2, 2], [9, 9]]]
    expected: [[0, 0], [2, 2]]
  - input: [[[5, 5], [5, 6], [10, 10], [10, 11]]]
    expected: [[5, 5], [5, 6]]
hidden_test_cases:
  - input: [[[0, 0], [0, 1], [0, 2], [0, 3]]]
    expected: [[0, 0], [0, 1]]
  - input: [[[-3, -3], [-1, -1], [4, 4], [6, 6]]]
    expected: [[-3, -3], [-1, -1]]
hints:
  - "Use two nested loops: for i in range(len(points)) and for j in range(i+1, len(points))."
  - "Squared Euclidean distance: (x1-x2)**2 + (y1-y2)**2. No sqrt needed for comparison."
  - "Track the best (minimum) distance found so far and update your answer when you find a smaller one."
  - "Since i < j always, the first point in your pair already comes before the second in the list."
time_limit_minutes: 20
external_reference:
  source: leetcode
  title: "Similar: K Closest Points to Origin"
  url: "https://leetcode.com/problems/k-closest-points-to-origin/"
tags:
