id: missing-numbers
concept_ids:
  - sets
level: beginner
tier: challenge
difficulty: 5
title: Find Missing Numbers
prompt: |
  Write a function find_missing(nums, n) that takes:
    - nums: a list of distinct integers (may be in any order)
    - n: a positive integer

  Return a sorted list of all integers from 1 to n (inclusive) that do NOT
  appear in nums.

  - If all integers from 1 to n are present, return an empty list.
  - You may assume all values in nums are positive integers.

  Examples:
    find_missing([1, 3, 5], 5)       -> [2, 4]
    find_missing([2, 4], 4)          -> [1, 3]
    find_missing([1, 2, 3, 4, 5], 5) -> []
    find_missing([], 3)              -> [1, 2, 3]
starter_code: |
  def find_missing(nums, n):
      # your code here
      pass
solution_code: |
  def find_missing(nums, n):
      num_set = set(nums)
      return sorted(i for i in range(1, n + 1) if i not in num_set)
function_name: find_missing
test_cases:
  - input: [[1, 3, 5], 5]
    expected: [2, 4]
  - input: [[2, 4], 4]
    expected: [1, 3]
  - input: [[1, 2, 3, 4, 5], 5]
    expected: []
  - input: [[], 3]
    expected: [1, 2, 3]
  - input: [[1], 1]
    expected: []
hidden_test_cases:
  - input: [[3, 5, 7], 10]
    expected: [1, 2, 4, 6, 8, 9, 10]
  - input: [[2, 4, 6, 8, 10], 10]
    expected: [1, 3, 5, 7, 9]
hints:
  - "Convert nums to a set for O(1) membership lookups."
  - "Use range(1, n+1) to iterate over all expected values and filter out those in your set."
  - "A list comprehension works well here: [i for i in range(1, n+1) if i not in num_set]."
external_reference:
  source: leetcode
  title: "Similar: Find All Numbers Disappeared in an Array"
  url: "https://leetcode.com/problems/find-all-numbers-disappeared-in-an-array/"
tags:
  - sets
  - membership-testing
  - missing-values
