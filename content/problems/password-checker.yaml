id: password-checker
concept_ids:
  - conditionals
level: beginner
tier: applied
difficulty: 4
title: Strong Password Validator
prompt: |
  Write a function is_strong_password(password) that takes a string and
  returns True if the password is considered strong, and False otherwise.

  A password is strong if ALL of the following are true:
    1. It has at least 8 characters.
    2. It contains at least one digit (0-9).
    3. It contains at least one uppercase letter (A-Z).

  If any condition fails, return False.

  Examples:
    is_strong_password("Hello1world")  -> True
    is_strong_password("hello1world")  -> False  (no uppercase)
    is_strong_password("Helloworld")   -> False  (no digit)
    is_strong_password("Hi1")          -> False  (too short)
    is_strong_password("ABCDEFG1")     -> True
starter_code: |
  def is_strong_password(password):
      # your code here
      pass
solution_code: |
  def is_strong_password(password):
      if len(password) < 8:
          return False
      has_digit = any(ch.isdigit() for ch in password)
      has_upper = any(ch.isupper() for ch in password)
      return has_digit and has_upper
function_name: is_strong_password
test_cases:
  - input: ["Hello1world"]
    expected: true
  - input: ["hello1world"]
    expected: false
  - input: ["Helloworld"]
    expected: false
  - input: ["Hi1"]
    expected: false
  - input: ["ABCDEFG1"]
    expected: true
  - input: ["12345678"]
    expected: false
hidden_test_cases:
  - input: ["SuperSecure9"]
    expected: true
  - input: ["weakpwd1"]
    expected: false
hints:
  - "Check the length first with len(password) < 8."
  - "Use any() with a generator expression: any(ch.isdigit() for ch in password)."
  - "Similarly, any(ch.isupper() for ch in password) checks for at least one uppercase letter."
  - "All three conditions must be True — use 'and' to combine them."
tags:
  - conditionals
  - strings
  - validation
