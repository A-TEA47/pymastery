id: unique-elements
concept_ids:
  - sets
level: beginner
tier: warmup
difficulty: 1
title: Count Unique Elements
prompt: |
  Write a function unique_count(lst) that takes a list and returns the number
  of unique (distinct) elements it contains.

  - The list may contain any mix of integers and strings.
  - Order does not matter.
  - An empty list has 0 unique elements.

  Examples:
    unique_count([1, 2, 3, 2, 1])     -> 3
    unique_count(["a", "b", "a"])     -> 2
    unique_count([])                  -> 0
    unique_count([42])                -> 1
starter_code: |
  def unique_count(lst):
      # your code here
      pass
solution_code: |
  def unique_count(lst):
      return len(set(lst))
function_name: unique_count
test_cases:
  - input: [[1, 2, 3, 2, 1]]
    expected: 3
  - input: [["a", "b", "a"]]
    expected: 2
  - input: [[]]
    expected: 0
  - input: [[42]]
    expected: 1
  - input: [[1, 1, 1, 1]]
    expected: 1
hidden_test_cases:
  - input: [[1, 2, 3, 4, 5, 1, 2, 3]]
    expected: 5
  - input: [["hello", "world", "hello", "hello"]]
    expected: 2
hints:
  - "A Python set automatically keeps only unique elements. Try converting the list to a set."
  - "Once you have a set, len() gives you the count."
tags:
  - sets
  - uniqueness
  - counting
